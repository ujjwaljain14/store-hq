<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Store HQ">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M42 21.5c-2.6-2.4-6.2-3.7-10.1-3.7-6.3 0-10.6 3.3-10.6 8.2 0 4.6 3.4 6.6 9.6 8l2.9.7c3.3.8 4.4 1.7 4.4 3.3 0 1.9-2 3.2-5.3 3.2-3.6 0-6.6-1.4-8.8-3.7l-3.6 4.4c2.8 2.9 7.1 4.6 12.1 4.6 7 0 11.4-3.4 11.4-8.6 0-4.6-3-6.9-9.6-8.3l-3-.7c-3-.7-4-1.5-4-2.9 0-1.7 1.8-2.8 4.6-2.8 2.8 0 5.3 1 7.1 2.6z' fill='white'/%3E%3C/svg%3E">
<title>Store HQ</title>
<style>
:root{
  --bg:#f5f6f8;--panel:#fff;--ink:#101318;--ink2:#374151;--mute:#6b7280;--line:#e6e8ec;--line2:#d9dce2;--soft:#f2f4f7;--hover:#f7f8fa;
  --acc:#4f46e5;--acc2:#6366f1;--acc-ink:#fff;--acc-soft:#eef0ff;
  --good:#047857;--good-soft:#e6f6ee;--bad:#c62828;--bad-soft:#fdecec;--warn:#b45309;--warn-soft:#fdf3e2;
  --pipe:#d97706;--pipe-soft:#fdf3e2;--live:#059669;--live-soft:#e6f6ee;--stop:#6b7280;--stop-soft:#f0f1f3;
  --r:12px;--top:56px;
  --sh:0 1px 2px rgba(16,24,40,.05);
  --sh2:0 4px 16px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d0f13;--panel:#15181e;--ink:#e8eaee;--ink2:#c3c8d1;--mute:#8f98a6;--line:#252a33;--line2:#323844;--soft:#1c2028;--hover:#1a1e25;
  --acc:#8b8ff8;--acc2:#8b8ff8;--acc-ink:#0d0f13;--acc-soft:#22254a;
  --good:#34d399;--good-soft:#0f2a1f;--bad:#f87171;--bad-soft:#2d1515;--warn:#fbbf24;--warn-soft:#2b2210;
  --pipe:#fbbf24;--pipe-soft:#2b2210;--live:#34d399;--live-soft:#0f2a1f;--stop:#9aa3b2;--stop-soft:#20242c;
  --sh:none;--sh2:0 6px 24px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
h3{font-size:15px}h4{font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
svg{flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:15.5px;padding:4px 8px 16px;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:550}
.nav a svg{width:18px;height:18px;color:var(--mute)}
.nav a:hover{background:var(--soft);text-decoration:none}
.nav a.on{background:var(--acc-soft);color:var(--acc)}
.nav a.on svg{color:var(--acc)}
.side-sec{margin-top:18px;padding:0 10px;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.stagelist{display:flex;flex-direction:column;gap:1px;margin-top:6px}
.stagelist a{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:8px;color:var(--ink2);font-size:13px}
.stagelist a:hover{background:var(--soft);text-decoration:none}
.stagelist b{margin-left:auto;font-weight:600;color:var(--mute);font-size:12px}
.side-foot{margin-top:auto;padding:10px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
.side-foot .repo{display:flex;align-items:center;gap:6px;color:var(--ink2);font-weight:550;word-break:break-all}
.side-foot .ok{width:7px;height:7px;border-radius:50%;background:var(--live);flex:none}
.side-foot .off{background:var(--pipe)}
.mainc{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 24px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
#pageTitle{font-weight:650;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#syncStatus{font-size:12.5px;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:6px}
#syncStatus::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live)}
#syncStatus.dirty{color:var(--warn);font-weight:600}#syncStatus.dirty::before{background:var(--warn)}
#syncStatus.err{color:var(--bad);font-weight:600}#syncStatus.err::before{background:var(--bad)}
#syncStatus.busy::before{background:var(--acc);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
main{padding:24px;max-width:1280px;width:100%;margin:0 auto}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);padding:7px 13px;border-radius:9px;font-weight:600;font-size:13.5px;white-space:nowrap;box-shadow:var(--sh);transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{background:var(--acc2)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
#saveBtn{min-width:76px;justify-content:center}
#saveBtn.pulse{box-shadow:0 0 0 3px var(--acc-soft)}
.iconbtn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--mute)}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.iconbtn.del:hover{color:var(--bad);background:var(--bad-soft)}
.iconbtn svg{width:16px;height:16px}
.iconbtn.bordered{border-color:var(--line2);background:var(--panel)}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 10px;font:inherit;outline:none;transition:border-color .12s,box-shadow .12s}
.in:hover{border-color:color-mix(in srgb,var(--line2) 50%,var(--mute))}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{resize:vertical;min-height:40px;line-height:1.5}
textarea.grow{resize:none;overflow:hidden}
.in::placeholder{color:var(--mute);opacity:.7}
.f{display:block;margin-bottom:12px}
.f>span,.lbl{display:block;font-size:11.5px;font-weight:650;color:var(--mute);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.ig{display:flex;align-items:center;gap:6px}
.ig em{font-style:normal;color:var(--mute);font-size:12px;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{color:var(--mute);font-size:12.5px;margin:2px 0 10px}
.mute{color:var(--mute)}
.pos{color:var(--good)}.negv{color:var(--bad)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--soft);color:var(--mute);font-size:11.5px;text-align:center;font-weight:650;line-height:18px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:20px;font-size:11.5px;font-weight:650;background:var(--soft);color:var(--mute);white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.st-idea{color:var(--mute);background:var(--soft)}
.st-testing{color:var(--warn);background:var(--warn-soft)}
.st-winning{color:var(--good);background:var(--good-soft)}
.st-paused{color:var(--stop);background:var(--stop-soft)}
.st-killed{color:var(--bad);background:var(--bad-soft)}
.badge{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
.badge.pos{background:var(--good-soft)}.badge.negv{background:var(--bad-soft)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);margin-bottom:16px}
.card>h3{margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.narrow{max-width:760px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;margin-bottom:16px;border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);background:var(--warn-soft)}
.banner.err{border-color:color-mix(in srgb,var(--bad) 25%,transparent);background:var(--bad-soft)}
.empty{padding:36px 20px;text-align:center;color:var(--mute);border:1.5px dashed var(--line2);border-radius:var(--r);background:var(--panel)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.dot.pipeline{background:var(--pipe)}.dot.live{background:var(--live)}.dot.stopped{background:var(--stop)}

/* ---------- tables ---------- */
table{border-collapse:collapse;width:100%}
.wrap{overflow-x:auto;margin:0 -4px}
.data th,.data td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.data th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:650}
.data th:first-child,.data td:first-child,.data .l{text-align:left}
.data tbody tr[data-act]{cursor:pointer}
.data tbody tr:hover{background:var(--hover)}
.data tfoot td{font-weight:700;border-bottom:0}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--acc);vertical-align:middle;margin-right:6px;opacity:.75}
.star{color:#f59e0b}

/* ---------- dashboard ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.tile span{display:flex;align-items:center;gap:7px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:650}
.tile b{display:block;font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:700}
.tile small{color:var(--mute);font-size:12px}
a.tile{color:inherit}a.tile:hover{text-decoration:none;border-color:var(--line2);box-shadow:var(--sh2)}

/* ---------- board ---------- */
.toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:0 1 320px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--mute)}
.search .in{padding-left:32px}
.board{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:14px;align-items:start}
.col{background:color-mix(in srgb,var(--soft) 70%,var(--bg));border:1px solid var(--line);border-radius:14px;padding:8px;min-height:220px;outline:2px dashed transparent;outline-offset:-3px;transition:outline-color .1s}
.col.over{outline-color:var(--acc);background:var(--acc-soft)}
.col-h{display:flex;align-items:center;gap:8px;font-weight:650;padding:6px 8px 10px}
.col-h .iconbtn{margin-left:auto;width:26px;height:26px}
.col-empty{color:var(--mute);font-size:12.5px;text-align:center;padding:30px 8px}
.pcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px 10px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh);transition:border-color .12s,box-shadow .12s,transform .12s}
.pcard::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--stop)}
.pcard.pipeline::before{background:var(--pipe)}.pcard.live::before{background:var(--live)}
.pcard:hover{border-color:var(--line2);box-shadow:var(--sh2)}
.pcard.dragging{opacity:.4}
.pc-top{display:flex;gap:10px;align-items:center}
.thumb{width:40px;height:40px;border-radius:9px;object-fit:cover;flex:none;background:var(--soft);border:1px solid var(--line)}
.thumb.ph{display:grid;place-items:center;font-weight:700;color:var(--mute);text-transform:uppercase}
.thumb.lg{width:46px;height:46px}
.pc-name{font-weight:620;line-height:1.3}
.pc-sub{font-size:12px;color:var(--mute)}
.pc-stats{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12.5px;margin-top:9px;color:var(--ink2)}
.pc-move{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;opacity:.0;transition:opacity .12s}
.pcard:hover .pc-move,.pcard:focus-within .pc-move{opacity:1}
@media (hover:none){.pc-move{opacity:1}}
.chip{border:1px solid var(--line2);background:var(--panel);border-radius:20px;padding:2px 10px;font-size:11.5px;color:var(--mute);font-weight:600}
.chip:hover{color:var(--acc);border-color:var(--acc)}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}

.pcard.drop-before::after{content:"";position:absolute;left:6px;right:6px;top:-6px;height:3px;border-radius:2px;background:var(--acc)}
.col-b.drop-end::after{content:"";display:block;height:3px;border-radius:2px;background:var(--acc);margin:2px 6px 8px}
.pc-move .iconbtn{width:24px;height:24px;border:1px solid var(--line2);background:var(--panel)}
.pc-move .iconbtn:disabled{opacity:.35;cursor:default}
.pc-move .iconbtn svg{width:13px;height:13px}
.pc-move .sp{flex:1}
.pc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.pc-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.lnk{display:inline-flex;align-items:center;gap:5px;max-width:100%;padding:3px 9px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--ink2);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk svg{width:12px;height:12px;color:var(--mute)}
.lnk:hover{text-decoration:none;border-color:var(--acc);color:var(--acc)}
.lnk:hover svg{color:var(--acc)}
.lnk.listing{background:var(--soft)}
.budget{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:6px;background:var(--acc-soft);color:var(--acc);font-weight:650;font-size:12px}
.budget svg{width:12px;height:12px}
.ptag{--h:220;display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:650;white-space:nowrap;border:1px solid transparent;color:hsl(var(--h) 55% 38%);background:hsl(var(--h) 85% 95%)}
@media (prefers-color-scheme:dark){.ptag{color:hsl(var(--h) 75% 78%);background:hsl(var(--h) 35% 19%)}}
button.ptag{cursor:pointer;font-family:inherit}
.ptag.pick:not(.on){background:transparent;color:var(--mute);border:1px dashed var(--line2)}
.ptag.pick:not(.on):hover{color:var(--ink);border-color:var(--mute)}
.ptag.pick.on::before{content:"✓";font-size:10px}
.tagpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagadd{display:inline-flex}
.tagadd input{width:140px;padding:3px 10px;border-radius:20px;font-size:12px}
.taglist{display:flex;flex-wrap:wrap;gap:8px}
.taglist .ptag button{border:0;background:transparent;color:inherit;padding:0;margin-left:2px;opacity:.6;font-size:14px;line-height:1}
.taglist .ptag button:hover{opacity:1}
select.in.sel{width:auto;padding:6px 30px 6px 10px}
/* ---------- product page ---------- */
.phead{position:sticky;top:var(--top);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:-24px -24px 20px;padding:14px 24px 0;border-bottom:1px solid var(--line)}
.ph-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.title-in{flex:1;min-width:200px;font-size:21px;font-weight:700;letter-spacing:-.015em;border:1px solid transparent;background:transparent;color:var(--ink);padding:3px 8px;margin-left:-8px;border-radius:8px;outline:none}
.title-in:hover{border-color:var(--line2)}.title-in:focus{border-color:var(--acc);background:var(--panel);box-shadow:0 0 0 3px var(--acc-soft)}
.meta{color:var(--mute);font-size:12.5px;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--soft);gap:2px}
.seg button,.seg label span{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:5px 12px;border-radius:7px;font-weight:600;color:var(--mute);font-size:13px;cursor:pointer;white-space:nowrap}
.seg label input{position:absolute;opacity:0;pointer-events:none}
.seg label input:checked+span,.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.seg button .dot{opacity:.35}.seg button.on .dot{opacity:1}
.tabs{display:flex;align-items:flex-end;gap:4px;margin-top:10px}
.tabs a{padding:9px 12px;font-weight:600;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center}
.tabs a:hover{color:var(--ink);text-decoration:none}
.tabs a.on{color:var(--ink);border-bottom-color:var(--acc)}
.tabs-right{margin-left:auto;display:flex;gap:6px;align-items:center;padding-bottom:7px}
.kstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.kstrip div{background:var(--panel);padding:11px 14px}
.kstrip span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:650}
.kstrip b{font-size:17px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:minmax(300px,1fr) minmax(440px,1.75fr);gap:16px;align-items:start}
.grid2>.card{margin-bottom:0}
.pages .pg{display:grid;grid-template-columns:110px 1fr auto auto;gap:6px;margin-bottom:6px;align-items:center}

/* ---------- calculator ---------- */
.calc{display:grid;grid-template-columns:minmax(220px,1fr) minmax(270px,1.2fr);gap:20px}
.calc .seg{margin-bottom:4px;flex-wrap:wrap}
.calc-in .f{margin-bottom:9px}
.calc-in .two{gap:8px 10px}
.pl th,.pl td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
.pl th{font-weight:600;color:var(--mute);text-transform:uppercase;font-size:11px;letter-spacing:.04em}
.pl td{font-variant-numeric:tabular-nums;font-weight:650;text-align:right;white-space:nowrap}
.pl td.sub{color:var(--mute);font-weight:500;font-size:11.5px;text-align:left;padding-left:10px}
.pl tr.cost td:nth-child(2){color:var(--bad)}
.pl tr.em th{color:var(--ink)}
.np{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--good-soft)}
.np.negv{background:var(--bad-soft)}
.np span{font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:.06em;color:var(--ink)}
.np strong{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.np.pos strong{color:var(--good)}.np.negv strong{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpis div{background:var(--soft);border-radius:9px;padding:8px 10px}
.kpis span{display:block;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;font-weight:650}
.kpis b{font-size:15px;font-variant-numeric:tabular-nums}

/* ---------- angles ---------- */
.afilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}

.aitem.open{border-color:color-mix(in srgb,var(--acc) 45%,var(--line));box-shadow:var(--sh2)}
.ahead{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;cursor:pointer;user-select:none}
.aitem.open .ahead{cursor:default;user-select:auto;border-bottom:1px solid var(--line);align-items:center;padding:10px 12px 10px 14px}
.aitem.open .ahead .anum,.aitem.open .ahead .chev{cursor:pointer}
.anum{flex:none;font-weight:750;color:var(--acc);background:var(--acc-soft);border-radius:7px;padding:2px 0;font-size:12px;width:34px;text-align:center;margin-top:1px}
.amain{flex:1;min-width:0}
.atitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:650;font-size:14.5px}
.atitle .untitled{color:var(--mute);font-weight:500;font-style:italic}
.aidea{color:var(--ink2);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.aidea.none{color:var(--mute);font-style:italic}
.aright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.astats{font-size:12px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;gap:8px;align-items:center}
.parts{display:flex;gap:3px}
.parts i{font-style:normal;font-size:10px;font-weight:750;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:var(--soft);color:var(--mute);opacity:.6}
.parts i.on{background:var(--acc-soft);color:var(--acc);opacity:1}
.chev{flex:none;color:var(--mute);display:grid;place-items:center;width:24px;height:24px;border-radius:6px;transition:transform .15s}
.chev svg{width:16px;height:16px}
.aitem.open .chev{transform:rotate(180deg)}
.ahead .angle-title{flex:1;min-width:180px;font-weight:650;font-size:15px;width:auto}
.ahead .pill-select{width:auto;border-radius:20px;padding:4px 26px 4px 10px;font-weight:650;font-size:12.5px;border-color:transparent}
.ahead .pill-select.st-idea{background-color:var(--soft);color:var(--mute)}
.ahead .pill-select.st-testing{background-color:var(--warn-soft);color:var(--warn)}
.ahead .pill-select.st-winning{background-color:var(--good-soft);color:var(--good)}
.ahead .pill-select.st-paused{background-color:var(--stop-soft);color:var(--stop)}
.ahead .pill-select.st-killed{background-color:var(--bad-soft);color:var(--bad)}
.ahead .acts{display:flex;gap:2px;align-items:center}
.aitem{position:relative}
.abody{padding:14px 16px 16px}
.hbc{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hbc .lbl{display:flex;align-items:center;gap:6px}
.hbc .lbl i{font-style:normal;font-size:10px;font-weight:750;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.perf{margin-top:6px;background:var(--soft);border-radius:10px;padding:12px 14px}
.perf-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.perf-h .tot{font-size:12.5px;color:var(--mute);flex:1}
.log{margin-top:10px}
.log th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);text-align:left;font-weight:650;padding:0 4px 4px}
.log td{padding:2px 4px}
.log .in{padding:5px 8px}
.quickadd{display:flex;gap:8px;margin-top:10px;padding:8px;border:1.5px dashed var(--line2);border-radius:var(--r);background:var(--panel)}
.quickadd .in{border-color:transparent;box-shadow:none;background:transparent}
.quickadd .in:focus{box-shadow:none}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;background:rgba(10,12,16,.45);display:grid;place-items:center;z-index:60;padding:20px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border-radius:14px;padding:22px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox p{color:var(--mute);margin:8px 0 18px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:550;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .18s ease-out}
.t.error{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.loading{padding:60px;text-align:center;color:var(--mute)}

/* ---------- responsive ---------- */
@media (max-width:1150px){.grid2{grid-template-columns:1fr}}
@media (max-width:960px){.board{grid-template-columns:1fr}.hbc{grid-template-columns:1fr}.calc{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}

}

  .aitem:not(.open) .chev{position:absolute;right:10px;top:12px}

  .tabs-right .btn span{display:none}
}

<script>
'use strict';
/* ============================================================
   Store HQ — static product dashboard, data stored in GitHub.
   Everything is in this one file. Data lives in a JSON file in
   a GitHub repo, read/written via the GitHub Contents API.
   ============================================================ */

const LS_CFG = 'storehq.config.v1';
const LS_DRAFT = 'storehq.draft.v1';
const STAGES = [
  { key: 'pipeline', label: 'Pipeline' },
  { key: 'live', label: 'Live' },
  { key: 'stopped', label: 'Stopped' },
];
const ANGLE_STATUS = ['Idea', 'Testing', 'Winning', 'Paused', 'Killed'];
const DEFAULT_TAGS = ['Problem solving', 'Wow factor', 'Scroll stopper'];
const TAG_HUES = { 'problem solving': 210, 'wow factor': 275, 'scroll stopper': 335 };
function tagHue(t) {
  const k = String(t).toLowerCase();
  if (TAG_HUES[k] != null) return TAG_HUES[k];
  let h = 0; for (const ch of k) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return [25, 160, 190, 45, 120, 300, 0, 95][h % 8];
}
const tagChip = t => `<span class="ptag" style="--h:${tagHue(t)}">${esc(t)}</span>`;

const S = {
  data: null, sha: null, dirty: false, changes: new Set(), saving: false, loadError: '', lastLoad: 0,
  boardQ: '', boardTag: '', openAngles: new Set(), angleFilter: 'All',
};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------------- icons ---------------- */
const ic = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I = {
  plus: ic('<path d="M12 5v14M5 12h14"/>'),
  chev: ic('<path d="m6 9 6 6 6-6"/>'),
  up: ic('<path d="m18 15-6-6-6 6"/>'),
  down: ic('<path d="m6 9 6 6 6-6"/>'),
  copy: ic('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>'),
  dup: ic('<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11M14.5 11v7M11 14.5h7"/>'),
  trash: ic('<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>'),
  x: ic('<path d="M18 6 6 18M6 6l12 12"/>'),
  ext: ic('<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'),
  search: ic('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>'),
  expand: ic('<path d="m7 15 5 5 5-5M7 9l5-5 5 5"/>'),
  collapse: ic('<path d="m7 20 5-5 5 5M7 4l5 5 5-5"/>'),
  back: ic('<path d="M19 12H5M12 19l-7-7 7-7"/>'),
  top: ic('<path d="M5 4h14M12 20V9M7 13l5-5 5 5"/>'),
  wallet: ic('<path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><path d="M16 14h.01"/>'),
};

/* ---------------- utils ---------------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const has = v => !(v === null || v === undefined || v === '');
const num = v => (has(v) && isFinite(Number(v))) ? Number(v) : 0;
const safeUrl = u => { try { const x = new URL(String(u).trim()); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; } };
function inr(v) {
  if (v == null || !isFinite(v)) return '—';
  const r = Math.round(v * 100) / 100;
  const a = Math.abs(r);
  const s = (Number.isInteger(r) || a >= 1000)
    ? Math.round(a).toLocaleString('en-IN')
    : a.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (r < 0 ? '-' : '') + '₹' + s;
}
const n0 = v => (v == null || !isFinite(v)) ? '—' : Math.round(v).toLocaleString('en-IN');
const pct = (v, d = 2) => (v == null || !isFinite(v)) ? '—' : (v * 100).toFixed(d) + '%';
const xx = v => (v == null || !isFinite(v)) ? '—' : v.toFixed(2) + 'x';
const pn = v => v >= 0 ? 'pos' : 'negv';

/* ---------------- data model ---------------- */
function defaultDefaults() {
  return { mode: 'aggregator', orders: 1000, cac: null, deliveryPct: 35, rto: 65, shipping: 0, shippingBasis: 'all', packaging: 0 };
}
function emptyData() { return { version: 1, settings: { defaults: defaultDefaults(), tags: DEFAULT_TAGS.slice() }, products: [], scratch: exampleCalc() }; }
function calcFrom(d) {
  return { mode: d.mode, aov: null, orders: d.orders, cac: d.cac, deliveryPct: d.deliveryPct, cogs: null, shipping: d.shipping, shippingBasis: d.shippingBasis, rto: d.rto, packaging: d.packaging };
}
function exampleCalc() {
  return { mode: 'aggregator', aov: 499, orders: 10000, cac: 45, deliveryPct: 35, cogs: 150, shipping: 0, shippingBasis: 'all', rto: 65, packaging: 0 };
}
function normalize(d) {
  if (!d || typeof d !== 'object') d = emptyData();
  d.version = d.version || 1;
  d.settings = d.settings || {};
  d.settings.defaults = Object.assign(defaultDefaults(), d.settings.defaults || {});
  d.products = Array.isArray(d.products) ? d.products : [];
  for (const p of d.products) {
    p.id = p.id || uid();
    if (!STAGES.some(s => s.key === p.status)) p.status = 'pipeline';
    p.angles = Array.isArray(p.angles) ? p.angles : [];
    p.pages = Array.isArray(p.pages) ? p.pages : [];
    p.calc = Object.assign(calcFrom(d.settings.defaults), p.calc || {});
    for (const a of p.angles) {
      a.id = a.id || uid();
      if (!ANGLE_STATUS.includes(a.status)) a.status = 'Idea';
      a.log = Array.isArray(a.log) ? a.log : [];
      for (const l of a.log) l.id = l.id || uid();
    }
    for (const pg of p.pages) pg.id = pg.id || uid();
    p.tags = Array.isArray(p.tags) ? p.tags.filter(t => typeof t === 'string' && t.trim()) : [];
  }
  if (!Array.isArray(d.settings.tags)) d.settings.tags = DEFAULT_TAGS.slice();
  for (const p of d.products) for (const t of p.tags) if (!d.settings.tags.includes(t)) d.settings.tags.push(t);
  // manual order inside each column (older data without an order: newest first)
  for (const s of STAGES) {
    d.products.filter(p => p.status === s.key)
      .sort((a, b) => ((has(a.order) ? a.order : 1e9) - (has(b.order) ? b.order : 1e9)) || stageSortKey(b).localeCompare(stageSortKey(a)))
      .forEach((p, i) => { p.order = i; });
  }
  d.scratch = Object.assign(exampleCalc(), d.scratch || {});
  return d;
}
const getP = id => S.data.products.find(p => p.id === id);

/* ---------------- calculator ---------------- */
function calcModel(c, p) {
  const aov = has(c.aov) ? num(c.aov) : num(p && p.sellingPrice);
  const cogsU = has(c.cogs) ? num(c.cogs) : num(p && p.listingPrice);
  const orders = num(c.orders), cac = num(c.cac);
  const d = Math.min(Math.max(num(c.deliveryPct), 0), 100) / 100;
  const self = c.mode === 'self';
  const shipU = self ? num(c.shipping) : 0;
  const shipAll = self && c.shippingBasis !== 'delivered';
  const rtoU = num(c.rto), packU = num(c.packaging);

  const adSpend = orders * cac;
  const revenue = orders * aov;
  const delivered = orders * d;
  const rto = orders - delivered;
  const deliveredRevenue = delivered * aov;
  const cogs = delivered * cogsU;
  const shipping = shipU * (shipAll ? orders : delivered);
  const rtoCost = rto * rtoU;
  const packaging = orders * packU;
  const net = deliveredRevenue - adSpend - cogs - shipping - rtoCost - packaging;
  const beforeAds = net + adSpend;
  const denom = aov - cogsU - (shipAll ? 0 : shipU) + rtoU;
  const beDel = denom > 0 ? (cac + packU + (shipAll ? shipU : 0) + rtoU) / denom : NaN;
  return {
    aov, cogsU, orders, cac, d, self, shipU, shipAll, rtoU, packU,
    adSpend, revenue, delivered, rto, deliveredRevenue, cogs, shipping, rtoCost, packaging,
    net, beforeAds,
    roi: adSpend > 0 ? net / adSpend : NaN,
    beCac: orders > 0 ? beforeAds / orders : NaN,
    beDel,
    netPerOrder: orders > 0 ? net / orders : NaN,
    margin: deliveredRevenue > 0 ? net / deliveredRevenue : NaN,
  };
}
function statsFrom(spend, orders, p) {
  const m = calcModel({ ...p.calc, orders, cac: orders > 0 ? spend / orders : 0 }, p);
  const net = orders > 0 ? m.net : -spend;
  return { spend, orders, cpa: orders > 0 ? spend / orders : NaN, roas: spend > 0 ? orders * m.aov / spend : NaN, net, roi: spend > 0 ? net / spend : NaN };
}
function angleStats(a, p) {
  let s = 0, o = 0;
  for (const l of a.log) { s += num(l.spend); o += num(l.orders); }
  return statsFrom(s, o, p);
}
function productStats(p) {
  let s = 0, o = 0;
  for (const a of p.angles) for (const l of a.log) { s += num(l.spend); o += num(l.orders); }
  return statsFrom(s, o, p);
}

/* ---------------- GitHub storage ---------------- */
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(String(b64).replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
const gh = {
  cfg() { try { return JSON.parse(localStorage.getItem(LS_CFG)) || null; } catch { return null; } },
  ready() { const c = this.cfg(); return !!(c && c.owner && c.repo && c.token && c.path); },
  repoUrl(c) { return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`; },
  fileUrl(c) { return this.repoUrl(c) + '/contents/' + c.path.replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/'); },
  headers(c) { return { Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }; },
  async err(r, c) {
    let msg = ''; try { msg = (await r.json()).message || ''; } catch {}
    if (r.status === 401) return new Error('GitHub rejected the token (invalid or expired). Update it in Settings.');
    if (r.status === 403) return new Error('Token lacks permission. It needs “Contents: Read and write” on ' + c.owner + '/' + c.repo + '. ' + msg);
    if (r.status === 404) return new Error(`Repo ${c.owner}/${c.repo} not found, or the token has no access to it.`);
    return new Error(`GitHub error ${r.status}: ${msg}`);
  },
  async get() {
    const c = this.cfg(), h = this.headers(c);
    const r = await fetch(this.fileUrl(c) + '?ref=' + encodeURIComponent(c.branch || 'main'), { headers: h, cache: 'no-store' });
    if (r.status === 404) {
      const rr = await fetch(this.repoUrl(c), { headers: h, cache: 'no-store' });
      if (!rr.ok) throw await this.err(rr, c);
      return { missing: true, sha: null };
    }
    if (!r.ok) throw await this.err(r, c);
    const j = await r.json();
    let b64 = j.content;
    if (!b64 || j.encoding !== 'base64') {
      const br = await fetch(this.repoUrl(c) + '/git/blobs/' + j.sha, { headers: h, cache: 'no-store' });
      if (!br.ok) throw await this.err(br, c);
      b64 = (await br.json()).content;
    }
    return { sha: j.sha, text: b64decode(b64) };
  },
  async put(text, sha, message) {
    const c = this.cfg();
    const body = { message, content: b64encode(text), branch: c.branch || 'main' };
    if (sha) body.sha = sha;
    const r = await fetch(this.fileUrl(c), { method: 'PUT', headers: { ...this.headers(c), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (r.status === 409 || (r.status === 422 && !sha)) { const e = new Error('conflict'); e.conflict = true; throw e; }
    if (!r.ok) throw await this.err(r, c);
    return (await r.json()).content.sha;
  },
  async test(c) {
    const h = this.headers(c);
    const rr = await fetch(this.repoUrl(c), { headers: h, cache: 'no-store' });
    if (!rr.ok) throw await this.err(rr, c);
    const repo = await rr.json();
    const canWrite = !repo.permissions || repo.permissions.push;
    const fr = await fetch(this.fileUrl(c) + '?ref=' + encodeURIComponent(c.branch || 'main'), { headers: h, cache: 'no-store' });
    return `Connected to ${repo.full_name} (${repo.private ? 'private' : 'public'} repo). `
      + (canWrite ? 'Write access OK. ' : '⚠ Token is read-only — saving will fail. ')
      + (fr.ok ? 'Data file found.' : 'Data file not there yet — it will be created on first Save.');
  },
};

/* ---------------- device setup link / code ---------------- */
function setupCode() {
  const c = gh.cfg();
  return b64encode(JSON.stringify({ owner: c.owner, repo: c.repo, branch: c.branch, path: c.path, token: c.token }))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function setupLink() { return location.origin + location.pathname + '#setup=' + setupCode(); }
function applySetupCode(raw) {
  try {
    let code = String(raw).trim().replace(/^.*#setup=/, '').replace(/[^A-Za-z0-9\-_+/=]/g, '').replace(/-/g, '+').replace(/_/g, '/');
    while (code.length % 4) code += '=';
    const o = JSON.parse(b64decode(code));
    if (!o.owner || !o.repo || !o.token) return false;
    localStorage.setItem(LS_CFG, JSON.stringify({ owner: o.owner, repo: o.repo, branch: o.branch || 'main', path: o.path || 'data/store.json', token: o.token }));
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
    return true;
  } catch { return false; }
}

/* ---------------- local draft (survives refresh) ---------------- */
let draftTimer = 0;
function persistDraft() {
  try { localStorage.setItem(LS_DRAFT, JSON.stringify({ data: S.data, baseSha: S.sha, dirty: S.dirty, changes: [...S.changes], at: Date.now() })); } catch {}
}
function persistDraftSoon() { clearTimeout(draftTimer); draftTimer = setTimeout(persistDraft, 250); }
function readDraft() { try { return JSON.parse(localStorage.getItem(LS_DRAFT)); } catch { return null; } }
function markDirty(msg) {
  S.dirty = true;
  if (msg) S.changes.add(msg);
  persistDraftSoon();
  updateSyncUI();
}
function commitMessage() {
  const c = [...S.changes];
  if (!c.length) return 'Update store data';
  const head = c.slice(0, 3).join('; ');
  return c.length > 3 ? `${head} (+${c.length - 3} more)` : head;
}

/* ---------------- load / save ---------------- */
async function loadRemote({ draft = null, silent = false } = {}) {
  if (!gh.ready()) return;
  if (!silent) setSync('Loading…', 'busy');
  try {
    const res = await gh.get();
    const remoteSha = res.sha;
    if (silent && remoteSha === S.sha) { S.lastLoad = Date.now(); updateSyncUI(); return; }
    let remoteData = null;
    if (!res.missing) {
      try { remoteData = normalize(JSON.parse(res.text)); }
      catch { throw new Error('The data file on GitHub is not valid JSON. Fix or delete it, then reload.'); }
    }
    if (draft && draft.dirty) {
      if (draft.baseSha === remoteSha) {
        S.data = normalize(draft.data); S.sha = remoteSha; S.dirty = true; S.changes = new Set(draft.changes || []);
        if (!silent) toast('Restored your unsaved changes');
      } else {
        const k = await choose('Unsaved changes in this browser',
          'You have changes that were never saved, but the file on GitHub has changed since (maybe from another device). Which version do you want to keep?',
          [{ k: 'remote', label: 'Use GitHub version' }, { k: 'local', label: 'Keep my changes', primary: true }]);
        if (k === 'local') { S.data = normalize(draft.data); S.dirty = true; S.changes = new Set([...(draft.changes || []), 'Restore local changes']); }
        else { S.data = remoteData || emptyData(); S.dirty = !remoteData; S.changes = new Set(remoteData ? [] : ['Create store data']); }
        S.sha = remoteSha;
      }
    } else {
      S.data = remoteData || emptyData();
      S.sha = remoteSha;
      S.dirty = !remoteData;
      S.changes = new Set(remoteData ? [] : ['Create store data']);
    }
    S.loadError = ''; S.lastLoad = Date.now();
    persistDraft();
    render(); updateSyncUI();
    if (!silent && res.missing) toast('Connected. No data file yet — it will be created when you Save.');
  } catch (e) {
    S.loadError = e.message;
    if (!S.data) { S.data = normalize(draft && draft.data); S.dirty = !!(draft && draft.dirty); S.sha = draft ? draft.baseSha : null; }
    render(); updateSyncUI();
    if (!silent) toast(e.message, 'error');
  }
}

async function save() {
  if (S.saving) return;
  if (!gh.ready()) {
    persistDraft();
    toast('Kept in this browser only. Connect GitHub in Settings to sync.');
    location.hash = '#/settings';
    return;
  }
  if (!S.dirty) { toast('Nothing to save — all changes are on GitHub'); return; }
  S.saving = true; updateSyncUI();
  const text = JSON.stringify(S.data, null, 2) + '\n';
  try {
    S.sha = await gh.put(text, S.sha, commitMessage());
    S.dirty = false; S.changes.clear(); S.loadError = '';
    persistDraft(); toast('Saved to GitHub ✓');
  } catch (e) {
    if (e.conflict) {
      S.saving = false; updateSyncUI();
      const k = await choose('The file changed on GitHub',
        'Someone (or you on another device) saved a newer version since this page loaded.',
        [{ k: 'cancel', label: 'Cancel' }, { k: 'remote', label: 'Load theirs (lose mine)', danger: true }, { k: 'mine', label: 'Overwrite with mine', primary: true }]);
      if (k === 'mine') {
        try { const cur = await gh.get(); S.sha = cur.sha; S.saving = false; return save(); }
        catch (e2) { toast(e2.message, 'error'); }
      } else if (k === 'remote') {
        S.dirty = false; S.changes.clear(); await loadRemote();
      }
    } else {
      S.loadError = e.message; toast(e.message, 'error');
    }
  } finally {
    S.saving = false; updateSyncUI();
  }
}

function setSync(text, cls = '') { const el = $('#syncStatus'); el.innerHTML = `<span>${esc(text)}</span>`; el.className = cls; }
function updateSyncUI() {
  const btn = $('#saveBtn');
  btn.disabled = S.saving;
  btn.textContent = S.saving ? 'Saving…' : 'Save';
  btn.classList.toggle('pulse', S.dirty);
  $('#reloadBtn').hidden = !gh.ready();
  const c = gh.cfg();
  $('#sideFoot').innerHTML = gh.ready()
    ? `<div class="repo"><span class="ok"></span>${esc(c.owner)}/${esc(c.repo)}</div><div>Synced with GitHub</div>`
    : `<div class="repo"><span class="ok off"></span>Local only</div><a href="#/settings">Connect GitHub →</a>`;
  if (S.saving) return setSync('Saving…', 'busy');
  if (!gh.ready()) return setSync('Local only', 'dirty');
  if (S.loadError) return setSync('Sync error', 'err');
  if (S.dirty) return setSync(`Unsaved changes (${S.changes.size || 1})`, 'dirty');
  setSync('All changes saved');
}

/* ---------------- UI primitives ---------------- */
function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 't ' + kind; t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(() => t.remove(), kind === 'error' ? 6000 : 2400);
}
function choose(title, body, options) {
  return new Promise(res => {
    const m = $('#modal');
    m.innerHTML = `<div class="mbox" role="dialog"><h3>${esc(title)}</h3><p>${esc(body)}</p>
      <div class="row" style="justify-content:flex-end">${options.map(o => `<button class="btn ${o.primary ? 'primary' : ''} ${o.danger ? 'danger' : ''}" data-k="${o.k}">${esc(o.label)}</button>`).join('')}</div></div>`;
    m.hidden = false;
    m.onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; m.hidden = true; m.onclick = null; res(b.dataset.k); };
  });
}
function inp(scope, key, val, { type = 'text', ph = '', cls = '', attrs = '' } = {}) {
  const isNum = type === 'num';
  return `<input class="in ${cls}" type="${isNum ? 'number' : type}" ${isNum ? 'step="any" inputmode="decimal"' : ''} data-scope="${scope}" data-key="${key}" data-type="${type}" value="${esc(val ?? '')}" placeholder="${esc(ph)}" ${attrs}>`;
}
function ta(scope, key, val, ph = '', rows = 3, grow = true) {
  return `<textarea class="in ${grow ? 'grow' : ''}" rows="${rows}" data-scope="${scope}" data-key="${key}" placeholder="${esc(ph)}">${esc(val ?? '')}</textarea>`;
}
function fld(label, inner) { return `<label class="f"><span>${label}</span>${inner}</label>`; }
function autoGrow(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }

/* scope string -> object being edited */
function resolve(scope) {
  const [t, a, b, c] = scope.split(':');
  if (t === 'settings') return S.data.settings.defaults;
  if (t === 'scratch') return S.data.scratch;
  const p = getP(a); if (!p) return null;
  if (t === 'p') return p;
  if (t === 'calc') return p.calc;
  if (t === 'pg') return p.pages.find(x => x.id === b);
  const an = p.angles.find(x => x.id === b);
  if (t === 'a') return an;
  if (t === 'l') return an && an.log.find(x => x.id === c);
  return null;
}

        ${f('rto', 'RTO cost', '₹/RTO')}

        ${self ? fld('Charge shipping on', `<select class="in" data-scope="${scope}" data-key="shippingBasis">
            <option value="all" ${c.shippingBasis !== 'delivered' ? 'selected' : ''}>All dispatched orders</option>
            <option value="delivered" ${c.shippingBasis === 'delivered' ? 'selected' : ''}>Delivered orders only</option></select>`) : ''}
        ${f('packaging', 'Packaging', '₹/order')}
      </div>
      ${p ? `<button class="btn sm" data-act="use-actuals" data-id="${p.id}" title="Sets Total orders and CAC from the spend & orders logged on this product's angles">Use actual orders &amp; CAC from angles</button>` : ''}
    </div>
    <div class="calc-out" data-derived="calc|${scope}">${calcOut(scope)}</div>
  </div>`;
}
function calcOut(scope) {
  const c = resolve(scope); if (!c) return '';
  const p = scope.startsWith('calc:') ? getP(scope.split(':')[1]) : null;
  const m = calcModel(c, p);
  const row = (l, v, sub = '', cls = '') => `<tr class="${cls}"><th>${l}</th><td>${v}</td><td class="sub">${sub}</td></tr>`;
  const dp = Number.isInteger(Math.round(m.d * 1000) / 10) ? 0 : 1;
  const beDel = !isFinite(m.beDel) ? '—' : m.beDel > 1 ? '>100%' : pct(m.beDel, 1);
  return `<table class="pl">
    ${row('Product price (AOV)', inr(m.aov))}
    ${row('Total orders', n0(m.orders))}
    ${row('CAC', inr(m.cac))}
    ${row('Ad spend', inr(m.adSpend), '', 'cost')}
    ${row('Total revenue', inr(m.revenue))}
    ${row('Delivery %', pct(m.d, dp))}
    ${row('Delivered revenue', inr(m.deliveredRevenue), 'actual', 'em')}
    ${row('Delivered orders', n0(m.delivered))}
    ${row('RTO orders', n0(m.rto))}
    ${row('COGS (delivered)', inr(m.cogs), inr(m.cogsU) + ' / unit', 'cost')}
    ${m.self ? row('Shipping cost', inr(m.shipping), inr(m.shipU) + (m.shipAll ? ' / order' : ' / delivered'), 'cost') : row('Shipping cost', inr(0), 'in RTO charge')}
    ${row('RTO cost', inr(m.rtoCost), inr(m.rtoU) + ' / order', 'cost')}
    ${row('Packaging cost', inr(m.packaging), inr(m.packU) + ' / order', 'cost')}
  </table>
  <div class="np ${pn(m.net)}"><span>Net profit</span><strong>${inr(m.net)}</strong></div>
  <div class="kpis">
    <div title="Net profit ÷ ad spend"><span>ROI</span><b>${pct(m.roi)}</b></div>
    <div title="Net profit + ad spend"><span>Profit before ads</span><b>${inr(m.beforeAds)}</b></div>
    <div title="Net profit ÷ total orders"><span>Net / order</span><b>${inr(m.netPerOrder)}</b></div>
    <div title="Max CAC at this delivery % before you lose money"><span>Break-even CAC</span><b>${inr(m.beCac)}</b></div>
    <div title="Min delivery % at this CAC before you lose money"><span>Break-even del. %</span><b>${beDel}</b></div>
    <div title="Net profit ÷ delivered revenue"><span>Net margin</span><b>${pct(m.margin, 1)}</b></div>
  </div>`;
}

/* ---------- angles ---------- */
function angleStatsLine(p, a) {
  const s = angleStats(a, p);
  if (!s.spend && !s.orders) return '';
  return `<span>${inr(s.spend)}</span><span>${n0(s.orders)} ord</span><span class="badge ${pn(s.roi)}">${pct(s.roi, 0)}</span>`;
}
function angleTotals(p, a) {
  const s = angleStats(a, p);
  if (!s.spend && !s.orders) return 'No data logged yet — add a row per day from your ads manager.';
  return `${inr(s.spend)} spend · ${n0(s.orders)} orders · CPA ${inr(s.cpa)} · ROAS ${xx(s.roas)} · Est. profit <b class="${pn(s.net)}">${inr(s.net)}</b> · ROI <b class="${pn(s.roi)}">${pct(s.roi, 1)}</b>`;
}
function angleSummary(p) {
  const rows = p.angles.map((a, i) => ({ a, i, s: angleStats(a, p) }));
  const withSpend = rows.filter(r => r.s.spend > 0);
  if (!withSpend.length) return '';
  const tot = productStats(p);
  const best = withSpend.reduce((b, r) => (!b || r.s.roi > b.s.roi) ? r : b, null);
  return `<section class="card">
    <div class="card-h"><h3>Angle performance</h3><span class="hint" style="margin:0">Est. profit uses this product's delivery %, COGS &amp; RTO</span></div>
    <div class="wrap"><table class="data">
    <thead><tr><th>Angle</th><th class="l">Status</th><th>Spend</th><th class="l">Share</th><th>Orders</th><th>CPA</th><th>ROAS</th><th>Est. profit</th><th>ROI</th></tr></thead>
    <tbody>${withSpend.map(({ a, i, s }) => `<tr data-act="focus-angle" data-angle="${a.id}" style="cursor:pointer">
      <td class="l">${best && best.a === a ? '<span class="star" title="Best ROI">★</span> ' : ''}<span class="mute">A${i + 1}</span> <b>${esc(a.title || 'Untitled angle')}</b></td>
      <td class="l"><span class="tag st-${a.status.toLowerCase()}">${esc(a.status)}</span></td>
      <td>${inr(s.spend)}</td>
      <td class="l"><span class="bar" style="width:${tot.spend ? Math.round(60 * s.spend / tot.spend) : 0}px"></span>${pct(tot.spend ? s.spend / tot.spend : NaN, 0)}</td>
      <td>${n0(s.orders)}</td><td>${inr(s.cpa)}</td><td>${xx(s.roas)}</td>
      <td class="${pn(s.net)}">${inr(s.net)}</td><td><span class="badge ${pn(s.roi)}">${pct(s.roi, 1)}</span></td></tr>`).join('')}</tbody>
    <tfoot><tr><td class="l">Total</td><td></td><td>${inr(tot.spend)}</td><td></td><td>${n0(tot.orders)}</td><td>${inr(tot.cpa)}</td><td>${xx(tot.roas)}</td>
      <td class="${pn(tot.net)}">${inr(tot.net)}</td><td>${pct(tot.roi, 1)}</td></tr></tfoot>
  </table></div></section>`;
}
function partsHTML(a) {
  return `<span class="parts" title="Hook / Body / CTA written">${[['H', a.hook], ['B', a.body], ['C', a.cta]].map(([k, v]) => `<i class="${(v || '').trim() ? 'on' : ''}">${k}</i>`).join('')}</span>`;
}
function angleItem(p, a, i) {
  const open = S.openAngles.has(a.id);
  const sc = `a:${p.id}:${a.id}`;
  const st = a.status.toLowerCase();
  if (!open) {
    const preview = (a.ideation || '').trim() || (a.hook || '').trim();
    return `<article class="aitem" id="angle-${a.id}">

          <div class="aidea ${preview ? '' : 'none'}">${preview ? esc(preview) : 'No ideation yet — click to write it'}</div>
        </div>
        <div class="aright"><div class="astats">${angleStatsLine(p, a)}</div>${partsHTML(a)}</div>
        <span class="chev">${I.chev}</span>
      </div>
    </article>`;
  }
  return `<article class="aitem open" id="angle-${a.id}">
    <div class="ahead">
      <span class="anum" data-act="toggle-angle" data-angle="${a.id}" title="Collapse">A${i + 1}</span>
      ${inp(sc, 'title', a.title, { cls: 'angle-title', ph: 'Angle title (e.g. “Neck pain from WFH”)' })}
      <select class="in pill-select st-${st}" data-scope="${sc}" data-key="status">${ANGLE_STATUS.map(s => `<option ${s === a.status ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <div class="acts">
        <button class="iconbtn" title="Move up" data-act="move-angle" data-id="${p.id}" data-angle="${a.id}" data-dir="-1" ${i === 0 ? 'disabled' : ''}>${I.up}</button>
        <button class="iconbtn" title="Move down" data-act="move-angle" data-id="${p.id}" data-angle="${a.id}" data-dir="1" ${i === p.angles.length - 1 ? 'disabled' : ''}>${I.down}</button>
        <button class="iconbtn" title="Copy hook, body & CTA" data-act="copy-angle" data-id="${p.id}" data-angle="${a.id}">${I.copy}</button>
        <button class="iconbtn" title="Duplicate" data-act="dup-angle" data-id="${p.id}" data-angle="${a.id}">${I.dup}</button>

      </div>

    </div>
    <div class="abody">
      ${fld('Ideation', ta(sc, 'ideation', a.ideation, 'Who is this for? What pain or desire does it hit? Reference ads, insights — notes for when you write it…', 2))}
      <div class="hbc">
        <label class="f"><span class="lbl"><i>H</i>Hook</span>${ta(sc, 'hook', a.hook, 'First 3 seconds — the scroll-stopper', 3)}</label>
        <label class="f"><span class="lbl"><i>B</i>Body</span>${ta(sc, 'body', a.body, 'Problem → product → proof → benefits', 3)}</label>
        <label class="f"><span class="lbl"><i>C</i>CTA</span>${ta(sc, 'cta', a.cta, 'Offer, urgency, COD available…', 3)}</label>
      </div>
      <div class="perf">
        <div class="perf-h"><h4>Performance</h4><span class="tot" data-derived="angletot|${p.id}|${a.id}">${angleTotals(p, a)}</span>
          <button class="btn sm" data-act="add-log" data-id="${p.id}" data-angle="${a.id}">${I.plus}Add day</button></div>
        ${a.log.length ? `<table class="log"><thead><tr><th style="width:150px">Date</th><th style="width:130px">Spend ₹</th><th style="width:100px">Orders</th><th>Note</th><th style="width:34px"></th></tr></thead>

          <td>${inp(ls, 'date', l.date, { type: 'date' })}</td>
          <td>${inp(ls, 'spend', l.spend, { type: 'num', ph: '0' })}</td>
          <td>${inp(ls, 'orders', l.orders, { type: 'num', ph: '0' })}</td>

      </div>
    </div>
  </article>`;
}

      ${f('deliveryPct', 'Delivery %', '%')}
      ${f('rto', 'RTO cost', '₹/RTO')}
      ${f('shipping', 'Shipping (self-ship)', '₹/order')}
      ${f('packaging', 'Packaging', '₹/order')}
    </div>
  </section>

  <section class="card narrow">
    <h3>Backup</h3>
    <p class="hint">GitHub already keeps every version, but you can also download a copy or restore from a file.</p>
    <div class="row">
      <button class="btn" data-act="export">Download backup (.json)</button>
      <label class="btn">Restore from file…<input type="file" id="importFile" accept="application/json,.json" hidden></label>
      ${S.dirty && ready ? '<button class="btn ghost danger" data-act="discard">Discard unsaved changes</button>' : ''}
    </div>
  </section>`;
}

/* ---------------- render / router ---------------- */
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [r, id, sub] = h.split('/');
  return { r: r || 'dashboard', id, sub };
}
function renderSide() {
  const ps = S.data ? S.data.products : [];
  $('#stagelist').innerHTML = STAGES.map(s => `<a href="#/board"><span class="dot ${s.key}"></span>${s.label}<b>${ps.filter(p => p.status === s.key).length}</b></a>`).join('');
}
function render() {
  const view = $('#view');
  if (!S.data) { view.innerHTML = '<div class="loading">Loading…</div>'; return; }
  const { r, id, sub } = route();
  const navKey = r === 'p' ? 'board' : r;
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.nav === navKey));
  let html, title;
  switch (r) {
    case 'board': html = viewBoard(); title = 'Products'; break;
    case 'p': { html = viewProduct(id, sub); const p = getP(id); title = p ? `Products / ${p.name || 'Untitled'}` : 'Product'; break; }
    case 'calc': html = viewCalc(); title = 'Calculator'; break;
    case 'settings': html = viewSettings(); title = 'Settings'; break;
    default: html = viewDashboard(); title = 'Dashboard';
  }
  view.innerHTML = html;
  $('#pageTitle').textContent = title;
  document.title = title.replace('Products / ', '') + ' · Store HQ';
  renderSide();
  $$('textarea.grow', view).forEach(autoGrow);
  if (r === 'board' && (S.boardQ || S.boardTag)) filterBoard();
}
function updateDerived() {
  $$('[data-derived]').forEach(el => {
    const [t, a, b] = el.dataset.derived.split('|');
    if (t === 'calc') el.innerHTML = calcOut(a);
    else if (t === 'angletot') { const p = getP(a); const an = p && p.angles.find(x => x.id === b); if (an) el.innerHTML = angleTotals(p, an); }
  });
}
function filterBoard() {
  const q = S.boardQ.trim().toLowerCase(), t = S.boardTag;
  $$('.pcard').forEach(c => { c.hidden = (!!q && !c.dataset.name.includes(q)) || (!!t && !c.dataset.tags.split('|').includes(t)); });
}
function scrollToAngle(aid, focusSel) {
  requestAnimationFrame(() => {
    const t = document.getElementById('angle-' + aid);
    if (!t) return;
    t.scrollIntoView({ block: 'start', behavior: 'smooth' });
    if (focusSel) { const f = $(focusSel, t); if (f) f.focus({ preventScroll: true }); }
  });
}

/* ---------------- actions ---------------- */
function setStatus(p, to) {
  if (!p || p.status === to) return;
  placeProduct(p, to, { index: 0 });
  if (to === 'live' && !p.liveAt) p.liveAt = today();
  if (to === 'stopped') p.stoppedAt = today();
  p.updatedAt = Date.now();
  markDirty(`Move ${p.name || 'product'} → ${to}`);
}
function newAngle(title = '') { return { id: uid(), title, ideation: '', hook: '', body: '', cta: '', status: 'Idea', createdAt: today(), log: [] }; }
function findA(el) { const p = getP(el.dataset.id || route().id); return { p, a: p && p.angles.find(x => x.id === el.dataset.angle) }; }

const actions = {
  'open'(el) {
    if (el.dataset.angle) {
      S.openAngles.add(el.dataset.angle); S.angleFilter = 'All';
      location.hash = `#/p/${el.dataset.id}/angles`;
      setTimeout(() => scrollToAngle(el.dataset.angle), 60);
    } else location.hash = '#/p/' + el.dataset.id;
  },
  'add-product'() {
    const p = { id: uid(), name: '', status: 'pipeline', createdAt: today(), updatedAt: Date.now(), listingLink: '', listingPrice: null, sellingPrice: null, image: '', notes: '', dailyBudget: null, tags: [], pages: [], angles: [], calc: calcFrom(S.data.settings.defaults) };
    S.data.products.push(p);
    placeProduct(p, 'pipeline', { index: 0 });
    markDirty('Add product');
    location.hash = '#/p/' + p.id;
    setTimeout(() => { const t = $('.title-in'); if (t) t.focus(); }, 60);
  },
  'move'(el) { setStatus(getP(el.dataset.id), el.dataset.to); render(); },
  'reorder'(el) {
    const p = getP(el.dataset.id); const col = colItems(p.status); const i = col.indexOf(p);
    const d = el.dataset.dir; const j = d === 'top' ? 0 : i + Number(d);
    if (j < 0 || j >= col.length || j === i) return;
    placeProduct(p, p.status, { index: j });
    markDirty(`Reorder ${p.status}`); render();
  },
  'toggle-tag'(el) {
    const p = getP(el.dataset.id); const t = el.dataset.tag;
    if (p.tags.includes(t)) p.tags = p.tags.filter(x => x !== t); else p.tags.push(t);
    el.classList.toggle('on', p.tags.includes(t));
    markDirty(`Update ${p.name || 'product'} tags`);
  },
  async 'del-tag'(el) {
    const t = el.dataset.tag; const used = S.data.products.filter(p => p.tags.includes(t)).length;
    const k = await choose(`Delete tag “${t}”?`, used ? `It will also be removed from ${used} product${used > 1 ? 's' : ''}.` : 'No products use it.', [{ k: 'no', label: 'Cancel' }, { k: 'yes', label: 'Delete tag', danger: true, primary: true }]);
    if (k !== 'yes') return;
    S.data.settings.tags = S.data.settings.tags.filter(x => x !== t);
    S.data.products.forEach(p => { p.tags = p.tags.filter(x => x !== t); });
    if (S.boardTag === t.toLowerCase()) S.boardTag = '';
    markDirty(`Delete tag ${t}`); render();
  },
  async 'del-product'(el) {
    const p = getP(el.dataset.id);
    const k = await choose('Delete product?', `“${p.name || 'Untitled'}” and all its angles will be removed. (You can still recover it from GitHub history after saving.)`, [{ k: 'no', label: 'Cancel' }, { k: 'yes', label: 'Delete', danger: true, primary: true }]);
    if (k !== 'yes') return;
    S.data.products = S.data.products.filter(x => x !== p);
    markDirty(`Delete ${p.name || 'product'}`);
    location.hash = '#/board';
  },
  'toggle-angle'(el, e) {
    if (e.target.closest('input,select,textarea,button')) return;
    const id = el.dataset.angle;
    if (S.openAngles.has(id)) S.openAngles.delete(id); else S.openAngles.add(id);
    render();
  },
  'focus-angle'(el) {
    S.openAngles.add(el.dataset.angle); S.angleFilter = 'All'; render(); scrollToAngle(el.dataset.angle);
  },
  'expand-all'(el) { getP(el.dataset.id).angles.forEach(a => S.openAngles.add(a.id)); render(); },
  'collapse-all'() { S.openAngles.clear(); render(); },
  'filter-angles'(el) { S.angleFilter = el.dataset.f; render(); },
  'add-angle'(el) {
    const p = getP(el.dataset.id); const a = newAngle(); p.angles.push(a);
    S.openAngles.add(a.id); S.angleFilter = 'All';
    markDirty(`Add angle to ${p.name || 'product'}`);
    if (route().sub !== 'angles') { location.hash = `#/p/${p.id}/angles`; setTimeout(() => scrollToAngle(a.id, '.angle-title'), 60); }
    else { render(); scrollToAngle(a.id, '.angle-title'); }
  },
  'move-angle'(el) {
    const { p } = findA(el); const i = p.angles.findIndex(a => a.id === el.dataset.angle); const j = i + Number(el.dataset.dir);
    if (j < 0 || j >= p.angles.length) return;
    [p.angles[i], p.angles[j]] = [p.angles[j], p.angles[i]];
    markDirty(`Reorder angles in ${p.name || 'product'}`); render(); scrollToAngle(el.dataset.angle);
  },
  'dup-angle'(el) {
    const { p, a } = findA(el); const i = p.angles.indexOf(a);
    const c = { ...JSON.parse(JSON.stringify(a)), id: uid(), title: (a.title || 'Angle') + ' (copy)', status: 'Idea', createdAt: today(), log: [] };
    p.angles.splice(i + 1, 0, c); S.openAngles.add(c.id);
    markDirty(`Duplicate angle in ${p.name || 'product'}`); render(); scrollToAngle(c.id, '.angle-title');
  },
  async 'del-angle'(el) {
    const { p, a } = findA(el);
    const k = await choose('Delete angle?', `“${a.title || 'Untitled angle'}” and its performance log will be removed.`, [{ k: 'no', label: 'Cancel' }, { k: 'yes', label: 'Delete', danger: true, primary: true }]);
    if (k !== 'yes') return;
    p.angles = p.angles.filter(x => x !== a); S.openAngles.delete(a.id);
    markDirty(`Delete angle from ${p.name || 'product'}`); render();
  },
  async 'copy-angle'(el) {
    const { a } = findA(el);
    const txt = `${a.title || ''}\n\nHOOK:\n${a.hook || ''}\n\nBODY:\n${a.body || ''}\n\nCTA:\n${a.cta || ''}`.trim();
    try { await navigator.clipboard.writeText(txt); toast('Angle copied'); } catch { toast('Could not access clipboard', 'error'); }
  },
  'add-log'(el) {
    const { p, a } = findA(el);
    const l = { id: uid(), date: today(), spend: null, orders: null, note: '' }; a.log.push(l);
    markDirty(`Log performance for ${p.name || 'product'}`); render();
    const t = $(`[data-scope="l:${p.id}:${a.id}:${l.id}"][data-key="spend"]`); if (t) t.focus();
  },
  'del-log'(el) {
    const { p, a } = findA(el);
    a.log = a.log.filter(l => l.id !== el.dataset.log); markDirty(`Edit performance for ${p.name || 'product'}`); render();
  },
  'add-page'(el) { const p = getP(el.dataset.id); p.pages.push({ id: uid(), label: '', url: '' }); markDirty(`Update ${p.name || 'product'}`); render(); },
  'del-page'(el) { const p = getP(el.dataset.id); p.pages = p.pages.filter(x => x.id !== el.dataset.page); markDirty(`Update ${p.name || 'product'}`); render(); },
  'open-link'(el) {
    const input = el.parentElement.querySelector(`[data-key="${el.dataset.src}"]`);
    const u = safeUrl(input && input.value);
    if (u) window.open(u, '_blank', 'noopener'); else toast('Enter a full link starting with https://', 'error');
  },
  'use-actuals'(el) {
    const p = getP(el.dataset.id); const st = productStats(p);
    if (!st.orders) { toast('No orders logged on this product’s angles yet', 'error'); return; }
    p.calc.orders = st.orders; p.calc.cac = Math.round(st.cpa * 100) / 100;
    markDirty(`Update ${p.name || 'product'} calculator`); render(); toast('Calculator now uses your real orders & CAC');
  },
  async 'copy-setup-link'() {
    try { await navigator.clipboard.writeText(setupLink()); toast('Setup link copied. Open it on your phone once.'); }
    catch { prompt('Copy this setup link:', setupLink()); }
  },
  async 'copy-setup-code'() {
    try { await navigator.clipboard.writeText(setupCode()); toast('Setup code copied'); }
    catch { prompt('Copy this setup code:', setupCode()); }
  },
  'reset-scratch'() { S.data.scratch = exampleCalc(); markDirty('Reset calculator'); render(); },
  async 'test-conn'() {
    const c = formCfg(); const msg = $('#cfgMsg');
    if (!c.owner || !c.repo || !c.token) { msg.textContent = 'Fill in owner, repo and token first.'; return; }
    msg.textContent = 'Testing…';
    try { msg.textContent = '✓ ' + await gh.test(c); } catch (e) { msg.textContent = '✕ ' + e.message; }
  },
  async 'disconnect'() {
    const k = await choose('Forget token?', 'This device will stop syncing until you enter a token again. Unsaved changes stay in this browser.', [{ k: 'no', label: 'Cancel' }, { k: 'yes', label: 'Forget token', danger: true, primary: true }]);
    if (k !== 'yes') return;
    const c = gh.cfg() || {}; c.token = ''; localStorage.setItem(LS_CFG, JSON.stringify(c)); S.loadError = ''; render(); updateSyncUI();
  },
  'export'() {
    const blob = new Blob([JSON.stringify(S.data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `store-hq-backup-${today()}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  async 'discard'() {
    const k = await choose('Discard unsaved changes?', 'Reloads the last saved version from GitHub.', [{ k: 'no', label: 'Cancel' }, { k: 'yes', label: 'Discard', danger: true, primary: true }]);
    if (k === 'yes') { S.dirty = false; S.changes.clear(); await loadRemote(); }
  },
};
function formCfg() {
  const f = $('#cfgForm'); const v = n => f.elements[n].value.trim();
  return { owner: v('owner'), repo: v('repo'), branch: v('branch') || 'main', path: v('path').replace(/^\/+/, '') || 'data/store.json', token: v('token') };
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  if (e.target.closest('a.ext-link')) return; // external links on cards open normally in a new tab
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault();
  e.stopPropagation();
  fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'boardSearch') { S.boardQ = el.value; filterBoard(); return; }
  if (el.tagName === 'TEXTAREA' && el.classList.contains('grow')) autoGrow(el);
  if (!el.dataset || !el.dataset.scope) return;
  const obj = resolve(el.dataset.scope); if (!obj) return;
  let v = el.value;
  if (el.dataset.type === 'num') v = v === '' ? null : Number(v);
  obj[el.dataset.key] = v;
  const [t, pid] = el.dataset.scope.split(':');
  const p = ['p', 'calc', 'a', 'l', 'pg'].includes(t) ? getP(pid) : null;
  if (p) p.updatedAt = Date.now();
  markDirty(p ? `Update ${p.name || 'product'}` : t === 'scratch' ? 'Update calculator' : 'Update settings');
  if (el.classList.contains('pill-select')) el.className = 'in pill-select st-' + String(v).toLowerCase();
  if (t === 'p' && el.dataset.key === 'name') $('#pageTitle').textContent = 'Products / ' + (v || 'Untitled');
  if (el.hasAttribute('data-rerender')) render(); else updateDerived();
});
document.addEventListener('change', e => {
  if (e.target.id === 'boardTag') { S.boardTag = e.target.value; filterBoard(); return; }
  if (e.target.id === 'importFile') {
    const file = e.target.files[0]; if (!file) return;
    file.text().then(async txt => {
      let d; try { d = normalize(JSON.parse(txt)); } catch { toast('That file is not valid JSON', 'error'); return; }
      const k = await choose('Restore from backup?', `This replaces everything with the backup (${d.products.length} products). Click Save afterwards to push it to GitHub.`, [{ k: 'no', label: 'Cancel' }, { k: 'yes', label: 'Restore', primary: true }]);
      if (k !== 'yes') return;
      S.data = d; markDirty('Restore from backup'); render();
    });
  }
});
document.addEventListener('submit', async e => {
  const ta_ = e.target.closest('[data-tagadd]');
  if (ta_) {
    e.preventDefault();
    const input = $('input', ta_); const t = input.value.trim().replace(/\s+/g, ' ').slice(0, 30);
    if (!t) return;
    const existing = S.data.settings.tags.find(x => x.toLowerCase() === t.toLowerCase()) || t;
    if (!S.data.settings.tags.includes(existing)) S.data.settings.tags.push(existing);
    const pid = ta_.dataset.tagadd;
    if (pid) { const p = getP(pid); if (!p.tags.includes(existing)) p.tags.push(existing); markDirty(`Update ${p.name || 'product'} tags`); }
    else markDirty(`Add tag ${existing}`);
    render();
    const ni = $(`[data-tagadd="${pid}"] input`); if (ni) ni.focus();
    return;
  }
  const qa = e.target.closest('[data-quickadd]');
  if (qa) {
    e.preventDefault();
    const input = $('#quickAngle'); const title = input.value.trim();
    if (!title) { input.focus(); return; }
    const p = getP(qa.dataset.quickadd); p.angles.push(newAngle(title)); S.angleFilter = 'All';
    markDirty(`Add angle to ${p.name || 'product'}`); render();
    const ni = $('#quickAngle'); if (ni) { ni.focus(); ni.scrollIntoView({ block: 'nearest' }); }
    toast(`Added “${title}”`);
    return;
  }
  if (e.target.id === 'setupForm') {
    e.preventDefault();
    if (!applySetupCode($('#setupInput').value)) { toast('That setup code is not valid', 'error'); return; }
    S.loadError = '';
    const draft = S.dirty ? { data: S.data, baseSha: S.sha, dirty: true, changes: [...S.changes] } : null;
    await loadRemote({ draft }); updateSyncUI();
    if (!S.loadError) { toast('This device is connected — you won’t need to do this again'); location.hash = '#/'; }
    return;
  }
  if (e.target.id !== 'cfgForm') return;
  e.preventDefault();
  const c = formCfg();
  localStorage.setItem(LS_CFG, JSON.stringify(c));
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  S.loadError = '';
  const draft = S.dirty ? { data: S.data, baseSha: S.sha, dirty: true, changes: [...S.changes] } : null;
  await loadRemote({ draft });
  updateSyncUI();
  if (!S.loadError) toast('Connected to GitHub');
});
/* drag & drop on the board */
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('.pcard'); if (!c) return;
  e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging');
});
function clearDropMarks() { $$('.col.over').forEach(x => x.classList.remove('over')); $$('.drop-before').forEach(x => x.classList.remove('drop-before')); $$('.drop-end').forEach(x => x.classList.remove('drop-end')); }
function dropTarget(col, y) { // first visible card whose middle is below the cursor
  return $$('.pcard:not(.dragging):not([hidden])', col).find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; }) || null;
}
document.addEventListener('dragend', e => { const c = e.target.closest && e.target.closest('.pcard'); if (c) c.classList.remove('dragging'); clearDropMarks(); });
document.addEventListener('dragover', e => {
  const col = e.target.closest && e.target.closest('[data-drop]'); if (!col) return;
  e.preventDefault();
  const before = dropTarget(col, e.clientY);
  clearDropMarks(); col.classList.add('over');
  if (before) before.classList.add('drop-before'); else $('.col-b', col).classList.add('drop-end');
});
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('[data-drop]'); if (!col) return;
  e.preventDefault();
  const p = getP(e.dataTransfer.getData('text/plain')); if (!p) return;
  const before = dropTarget(col, e.clientY);
  const stage = col.dataset.drop, from = p.status;
  if (from !== stage) { if (stage === 'live' && !p.liveAt) p.liveAt = today(); if (stage === 'stopped') p.stoppedAt = today(); }
  placeProduct(p, stage, { beforeId: before ? before.dataset.id : null });
  p.updatedAt = Date.now();
  markDirty(from !== stage ? `Move ${p.name || 'product'} → ${stage}` : `Reorder ${stage}`);
  clearDropMarks(); render();
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('ahead')) e.target.click();
});
window.addEventListener('beforeunload', e => { if (S.dirty && gh.ready()) { e.preventDefault(); e.returnValue = ''; } });
let lastRoute = '';
window.addEventListener('hashchange', () => {
  const { r, id } = route(); const key = r + '/' + (id || '');
  if (key !== lastRoute) { S.angleFilter = 'All'; if (r === 'p' && !lastRoute.startsWith('p/' + id)) S.openAngles.clear(); }
  lastRoute = key;
  render(); window.scrollTo(0, 0);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && gh.ready() && !S.dirty && !S.saving && Date.now() - S.lastLoad > 60000) loadRemote({ silent: true });
});
$('#saveBtn').addEventListener('click', save);
$('#reloadBtn').addEventListener('click', async () => {
  if (S.dirty) {
    const k = await choose('Reload from GitHub?', 'You have unsaved changes. Reloading will discard them.', [{ k: 'no', label: 'Cancel' }, { k: 'yes', label: 'Discard & reload', danger: true, primary: true }]);
    if (k !== 'yes') return;
    S.dirty = false; S.changes.clear();
  }
  await loadRemote(); toast('Loaded latest from GitHub');
});

/* home-screen icon (PNG drawn at runtime so this stays a single file) */
(function touchIcon() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180; const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, '#6366f1'); g.addColorStop(1, '#a855f7');
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#fff'; x.font = '800 112px -apple-system, Segoe UI, Arial, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('S', 90, 98);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
  } catch {}
})();

/* ---------------- boot ---------------- */
(async function boot() {
  if (location.hash.startsWith('#setup=')) {
    const ok = applySetupCode(location.hash);
    history.replaceState(null, '', location.pathname + '#/'); // remove token from the address bar
    setTimeout(() => toast(ok ? 'This device is connected — you won’t need to enter the token again' : 'Setup link is invalid', ok ? '' : 'error'), 300);
  }
  const { r, id } = route(); lastRoute = r + '/' + (id || '');
  const draft = readDraft();
  if (!gh.ready()) {
    S.data = normalize(draft && draft.data);
    S.dirty = !!(draft && draft.dirty); S.changes = new Set((draft && draft.changes) || []);
    render(); updateSyncUI();
    return;
  }
  updateSyncUI();
  await loadRemote({ draft });
})();
</script>
